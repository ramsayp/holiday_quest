<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>HolidayQuest</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json"/>
  <meta name="theme-color" content="#0E1B2A"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="HolidayQuest"/>
  <link rel="apple-touch-icon" href="icon-512.png"/>
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png"/>
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png"/>

  <!-- Splash screens for iPhone -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black"/>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

const WORKER    = "https://salesforce-proxy.paulsbramsay.workers.dev";
const LS_JWT    = "hq_jwt";
const LS_CLIENT = "hq_client";
const LS_HOLIDAY= "hq_holiday";
const LS_PLAYER = "hq_player";

const CAT_EMOJI = { Restaurant:"🍽️", Bar:"🍸", Club:"🕺", Pub:"🍺", Other:"📍" };
const COLORS    = ["#1A1A1A","#4A148C","#1A237E","#0277BD","#006064","#1B5E20","#F57F17","#E64A19","#B71C1C","#880E4F","#CE93D8","#64B5F6","#4DD0E1","#81C784","#FFF176","#FFCC80","#EF9A9A","#F48FB1","#B0BEC5","#F5F5F5"];

function initial(n) { return (n||"?")[0].toUpperCase(); }
function timeAgo(ts) {
  const d=(Date.now()-ts)/1000;
  if(d<60) return "just now";
  if(d<3600) return Math.floor(d/60)+"m ago";
  if(d<86400) return Math.floor(d/3600)+"h ago";
  return Math.floor(d/86400)+"d ago";
}
async function hashPassword(p) {
  const buf=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(p));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}
async function api(type,payload={},jwt=null) {
  const headers={"Content-Type":"application/json"};
  if(jwt) headers["Authorization"]=`Bearer ${jwt}`;
  const res=await fetch(WORKER,{method:"POST",headers,body:JSON.stringify({type,payload})});
  const text=await res.text();
  let data; try{data=JSON.parse(text);}catch{data={error:text};}
  if(!res.ok) throw new Error(data.error||`Error ${res.status}`);
  // Also throw if Salesforce returns an error field (200 status but logical error)
  if(data.error) throw new Error(data.error);
  return data;
}

// Check URL params for setup link e.g. ?setup=email@test.com&token=abc123
function getUrlParams() {
  const params = new URLSearchParams(window.location.search);
  return { setupEmail: params.get("setup"), setupToken: params.get("token") };
}

function App() {
  // status: booting|login|holidays|holidaySetup|app|wrapped|accountSetup|error
  const [status,setStatus]       = useState("booting");
  const [jwt,setJwt]             = useState(null);
  const [client,setClient]       = useState(null);
  const [holidays,setHolidays]   = useState([]);
  const [game,setGame]           = useState(null);
  const [myPlayer,setMyPlayer]   = useState(null);
  const [error,setError]         = useState(null);
  const [saving,setSaving]       = useState(false);
  const [entering,setEntering]   = useState(false);
  const [syncing,setSyncing]     = useState(false);

  // UI
  const [tab,setTab]                 = useState("places");
  const [sheet,setSheet]             = useState(null);
  const [adminTab,setAdminTab]       = useState("players");
  const [editPlayer,setEditPlayer]   = useState(null);
  const [newPlace,setNewPlace]       = useState({name:"",points:"200",category:"Bar"});
  const [editPlace,setEditPlace]     = useState(null);
  const [exportTxt,setExportTxt]     = useState("");
  const [toast,setToast]             = useState(null);
  const [busy,setBusy]               = useState(false);
  const [wrapConfirm,setWrapConfirm] = useState(false);

  // Auth forms
  const [authName,setAuthName]   = useState("");
  const [authEmail,setAuthEmail] = useState("");
  const [authPass,setAuthPass]   = useState("");
  const [authError,setAuthError] = useState("");
  const [authBusy,setAuthBusy]   = useState(false);
  const [authMode,setAuthMode]   = useState("login");
  const [authStep,setAuthStep]   = useState("email"); // email | password
  const [showPass,setShowPass]   = useState(false);
  const [showSetupPass,setShowSetupPass] = useState(false);

  // Account setup (placeholder → full account)
  const [setupEmail,setSetupEmail]       = useState("");
  const [setupToken,setSetupToken]       = useState("");
  const [setupName,setSetupName]         = useState("");
  const [setupPass,setSetupPass]         = useState("");
  const [setupPassConf,setSetupPassConf] = useState("");
  const [setupError,setSetupError]       = useState("");
  const [setupBusy,setSetupBusy]         = useState(false);

  // New holiday
  const [newHolidayName,setNewHolidayName] = useState("");
  const [adminColor,setAdminColor]         = useState("#7B5E9C");

  // Invite
  const [confirmRemovePlayer,setConfirmRemovePlayer] = useState(null);
  const [confirmRemovePlace,setConfirmRemovePlace]   = useState(null);
  const [tagSelection,setTagSelection] = useState([]);
  const [inviteEmail,setInviteEmail] = useState("");
  const [inviteName,setInviteName]   = useState("");
  const [inviteColor,setInviteColor] = useState("#3D9BB5");
  const [inviting,setInviting]       = useState(false);

  const gameRef   = useRef(game);
  const jwtRef    = useRef(jwt);
  const playerRef = useRef(myPlayer);
  const clientRef = useRef(client);
  useEffect(()=>{gameRef.current=game;},[game]);
  useEffect(()=>{jwtRef.current=jwt;},[jwt]);
  useEffect(()=>{playerRef.current=myPlayer;},[myPlayer]);
  useEffect(()=>{clientRef.current=client;},[client]);

  // ── Boot ──────────────────────────────────────────────────────
  useEffect(()=>{
    (async()=>{
      // Check for setup link in URL first
      const { setupEmail: se, setupToken: st } = getUrlParams();
      if(se) {
        setSetupEmail(se);
        setSetupToken(st||"");
        setStatus("accountSetup");
        return;
      }

      const sj=localStorage.getItem(LS_JWT);
      const sc=localStorage.getItem(LS_CLIENT);
      if(sj&&sc){
        const c=JSON.parse(sc);
        setJwt(sj); jwtRef.current=sj;
        setClient(c); clientRef.current=c;
        try{
          const res=await api("GetMyHolidays",{clientId:c.clientId},sj);
          setHolidays(res.holidays||[]);
          const sh=localStorage.getItem(LS_HOLIDAY);
          const sp=localStorage.getItem(LS_PLAYER);
          if(sh&&sp){
            const h=res.holidays?.find(h=>h.holidayId===sh);
            if(h){
              const g=await api("GetHolidayState",{holidayId:sh},sj);
              setGame(g); gameRef.current=g;
              const p=g.players?.find(p=>p.id===sp);
              if(p){setMyPlayer(p);playerRef.current=p;setStatus(g.wrapped?"wrapped":"app");return;}
            }
          }
          setStatus("holidays");
        }catch(e){setError(e.message);setStatus("error");}
      }else{setStatus("login");}
    })();
  },[]);

  // ── Auto-sync ──────────────────────────────────────────────────
  useEffect(()=>{
    if(status!=="app") return;
    const iv=setInterval(async()=>{
      if(!jwtRef.current||!gameRef.current) return;
      try{
        const g=await api("GetHolidayState",{holidayId:gameRef.current.holidayId},jwtRef.current);
        setGame(g); gameRef.current=g;
        if(g.wrapped) setStatus("wrapped");
        if(playerRef.current){
          const u=g.players?.find(p=>p.id===playerRef.current.id);
          if(u){setMyPlayer(u);playerRef.current=u;}
        }
      }catch{}
    },30000);
    return()=>clearInterval(iv);
  },[status]);

  function showToast(msg,type="ok"){
    const id=Date.now(); setToast({msg,type,id});
    setTimeout(()=>setToast(t=>t?.id===id?null:t),3000);
  }
  function closeSheet(){setSheet(null);setEditPlayer(null);setEditPlace(null);setWrapConfirm(false);setTagSelection([]);setConfirmRemovePlace(null);}

  async function loadGame(){
    if(!gameRef.current) return null;
    setSyncing(true);
    try{
      const g=await api("GetHolidayState",{holidayId:gameRef.current.holidayId},jwtRef.current);
      setGame(g); gameRef.current=g; return g;
    }catch(e){showToast(e.message,"err"); return null;}
    finally{setSyncing(false);}
  }

  async function loadHolidays(){
    try{
      const res=await api("GetMyHolidays",{clientId:clientRef.current.clientId},jwtRef.current);
      setHolidays(res.holidays||[]); return res.holidays||[];
    }catch(e){showToast(e.message,"err"); return [];}
  }

  // ── Login ──────────────────────────────────────────────────────
  async function doLogin(email,pass){
    const hash=await hashPassword(pass);
    let verify;
    try{ verify=await api("VerifyClient",{email:email.trim(),passwordHash:hash}); }
    catch(e){ throw new Error("Email or password incorrect"); }
    if(!verify?.clientId) throw new Error("Email or password incorrect");
    const tokenRes=await api("GetToken",{sub:verify.clientId,name:verify.name,email:verify.email,app:"holidayquest"});
    const newJwt=tokenRes.token;
    const newClient={clientId:verify.clientId,name:verify.name,email:verify.email};
    localStorage.setItem(LS_JWT,newJwt); localStorage.setItem(LS_CLIENT,JSON.stringify(newClient));
    setJwt(newJwt); jwtRef.current=newJwt;
    setClient(newClient); clientRef.current=newClient;
    const res=await api("GetMyHolidays",{clientId:verify.clientId},newJwt);
    setHolidays(res.holidays||[]);
    setStatus("holidays");
  }

  async function checkEmailStep(){
    setAuthError("");
    if(!authEmail.trim()) return setAuthError("Enter your email");
    setAuthBusy(true);
    try{
      const check=await api("CheckEmail",{email:authEmail.trim()});
      if(!check.exists){
        // Email not found — suggest registering
        setAuthError("No account found. Try registering instead.");
      } else if(check.isPlaceholder){
        // Placeholder — redirect to account setup
        setSetupEmail(authEmail.trim());
        setStatus("accountSetup");
      } else {
        // Full account — show password field
        setAuthStep("password");
      }
    }catch(e){ setAuthError(e.message); }
    setAuthBusy(false);
  }

  async function login(){
    setAuthError("");
    if(!authEmail.trim()||!authPass) return setAuthError("Enter email and password");
    setAuthBusy(true);
    try{ await doLogin(authEmail,authPass); }
    catch(e){ if(e.message!=="REDIRECT") setAuthError(e.message); }
    setAuthBusy(false);
  }

  async function register(){
    setAuthError("");
    if(!authName.trim()) return setAuthError("Enter your name");
    if(!authEmail.trim()) return setAuthError("Enter your email");
    if(authPass.length<6) return setAuthError("Password must be at least 6 characters");
    setAuthBusy(true);
    try{
      // Check if placeholder exists first
      const check=await api("CheckEmail",{email:authEmail.trim()});
      if(check.exists&&check.isPlaceholder){
        // Redirect to account setup with their email pre-filled
        setSetupEmail(authEmail.trim());
        setSetupName(authName.trim());
        setStatus("accountSetup");
        setAuthBusy(false);
        return;
      }
      const hash=await hashPassword(authPass);
      await api("CreateClient",{name:authName.trim(),email:authEmail.trim(),passwordHash:hash});
      await doLogin(authEmail.trim(),authPass);
    }catch(e){ setAuthError(e.message); }
    setAuthBusy(false);
  }

  // ── Account setup (placeholder → full) ────────────────────────
  async function setupAccount(){
    setSetupError("");
    if(!setupName.trim()) return setSetupError("Enter your name");
    if(setupPass.length<6) return setSetupError("Password must be at least 6 characters");
    if(setupPass!==setupPassConf) return setSetupError("Passwords don't match");
    setSetupBusy(true);
    try{
      const hash=await hashPassword(setupPass);
      const res=await api("SetupAccount",{
        email:setupEmail.trim(),
        name:setupName.trim(),
        passwordHash:hash
      });
      // Auto-login after setup
      await doLogin(setupEmail.trim(),setupPass);
      showToast("Welcome to HolidayQuest! 🎉");
    }catch(e){
      if(e.message!=="REDIRECT") setSetupError(e.message);
    }
    setSetupBusy(false);
  }

  function logout(){
    localStorage.clear();
    setJwt(null); setClient(null); setGame(null); setMyPlayer(null); setHolidays([]);
    setStatus("login");
  }

  // ── Create holiday ─────────────────────────────────────────────
  async function createHoliday(){
    if(!newHolidayName.trim()) return showToast("Enter a holiday name","err");
    setSaving(true);
    try{
      const res=await api("CreateHoliday",{clientId:clientRef.current.clientId,name:newHolidayName.trim()},jwtRef.current);
      // Update admin player colour
      await api("UpdatePlayer",{playerId:res.playerId,color:adminColor},jwtRef.current);
      const g=await api("GetHolidayState",{holidayId:res.holidayId},jwtRef.current);
      setGame(g); gameRef.current=g;
      localStorage.setItem(LS_HOLIDAY,res.holidayId);
      localStorage.setItem(LS_PLAYER,res.playerId);
      const p=g.players?.find(p=>p.id===res.playerId);
      if(p){setMyPlayer(p);playerRef.current=p;}
      await loadHolidays();
      setNewHolidayName("");
      setStatus("holidaySetup");
      showToast(`${res.name} created! 🎉`);
    }catch(e){showToast(e.message,"err");}
    setSaving(false);
  }

  // ── Enter existing holiday ─────────────────────────────────────
  async function enterHoliday(h){
    setEntering(h.holidayId);
    try{
      const g=await api("GetHolidayState",{holidayId:h.holidayId},jwtRef.current);
      setGame(g); gameRef.current=g;
      localStorage.setItem(LS_HOLIDAY,h.holidayId);
      localStorage.setItem(LS_PLAYER,h.playerId);
      const p=g.players?.find(p=>p.id===h.playerId);
      if(p){setMyPlayer(p);playerRef.current=p;}
      setStatus(g.wrapped?"wrapped":"app");
    }catch(e){showToast(e.message,"err");}
    setEntering(false);
  }

  // ── Invite player ──────────────────────────────────────────────
  async function invitePlayer(){
    if(!inviteEmail.trim()) return showToast("Enter an email","err");
    setInviting(true);
    try{
      const res=await api("AddPlayerByEmail",{
        holidayId:gameRef.current.holidayId,
        email:inviteEmail.trim(),
        name:inviteName.trim()||null,
        color:inviteColor
      },jwtRef.current);
      await loadGame();
      setInviteEmail(""); setInviteName("");
      if(res.wasCreated){
        showToast(`Invite sent to ${res.email} — they need to set up their account 📧`);
      } else {
        showToast(`${res.playerName} added! They'll see this holiday when they log in 🎉`);
      }
    }catch(e){showToast(e.message,"err");}
    setInviting(false);
  }

  // ── Game actions ───────────────────────────────────────────────
  async function checkIn(place){
    if(busy||saving) return;
    if(isVisited(myPlayer?.id,place.id)) return showToast("Already visited!","err");
    setBusy(true);
    try{await api("CreateCheckin",{playerId:myPlayer.id,placeId:place.id,taggedById:null},jwtRef.current);await loadGame();showToast(`+${place.points} pts · ${place.name}`);}
    catch(e){showToast(e.message,"err");}
    setBusy(false);
  }

  function toggleTag(playerId){
    setTagSelection(sel=>sel.includes(playerId)?sel.filter(id=>id!==playerId):[...sel,playerId]);
  }

  async function submitTags(){
    const place=sheet?.data; if(!place||tagSelection.length===0) return;
    closeSheet();
    setTagSelection([]);
    try{
      // Check in yourself first if not already visited
      if(!isVisited(myPlayer.id,place.id)){
        await api("CreateCheckin",{playerId:myPlayer.id,placeId:place.id,taggedById:null},jwtRef.current);
      }
      // Tag each selected player (skip if already checked in)
      for(const taggedId of tagSelection){
        if(!isVisited(taggedId,place.id)){
          await api("CreateCheckin",{playerId:taggedId,placeId:place.id,taggedById:myPlayer.id},jwtRef.current);
        }
      }
      await loadGame();
      const names=tagSelection.map(id=>gameRef.current.players?.find(p=>p.id===id)?.name).filter(Boolean);
      showToast(`Checked in & tagged ${names.join(", ")} at ${place.name}`);
    }
    catch(e){showToast(e.message,"err");}
  }

  async function submitAddPlace(){
    const name=newPlace.name.trim(); if(!name) return showToast("Enter a name","err");
    setSaving(true);
    try{await api("AddPlace",{holidayId:gameRef.current.holidayId,name,points:parseInt(newPlace.points)||200,category:newPlace.category},jwtRef.current);setNewPlace({name:"",points:"200",category:"Bar"});closeSheet();await loadGame();showToast(`Added ${name}`);}
    catch(e){showToast(e.message,"err");}
    setSaving(false);
  }

  async function removePlace(placeId){
    setSaving(true);
    try{await api("RemovePlace",{placeId},jwtRef.current);await loadGame();showToast("Removed");}
    catch(e){showToast(e.message,"err");}
    setSaving(false);
  }

  async function savePlaceEdit(){
    if(!editPlace) return;
    const name=editPlace.name.trim(); if(!name) return showToast("Name can't be empty","err");
    setSaving(true);
    try{
      await api("UpdatePlace",{
        placeId:editPlace.id,
        name,
        points:parseInt(editPlace.points)||200,
        category:editPlace.category
      },jwtRef.current);
      await loadGame();
      setEditPlace(null);
      showToast("Place updated");
    }catch(e){showToast(e.message,"err");}
    setSaving(false);
  }

  async function savePlayerEdit(){
    if(!editPlayer) return;
    const name=editPlayer.name.trim(); if(!name) return showToast("Name can't be empty","err");
    setSaving(true);
    try{await api("UpdatePlayer",{playerId:editPlayer.id,name,color:editPlayer.color},jwtRef.current);await loadGame();setEditPlayer(null);showToast("Saved");}
    catch(e){showToast(e.message,"err");}
    setSaving(false);
  }

  async function removePlayer(playerId){
    setSaving(true);
    try{await api("RemovePlayer",{playerId},jwtRef.current);await loadGame();showToast("Removed");}
    catch(e){showToast(e.message,"err");}
    setSaving(false);
  }

  async function wrapUp(){
    setSaving(true);
    try{await api("WrapHoliday",{holidayId:gameRef.current.holidayId},jwtRef.current);await loadGame();setWrapConfirm(false);setSheet(null);setStatus("wrapped");showToast("Holiday wrapped! 🎉");}
    catch(e){showToast(e.message,"err");}
    setSaving(false);
  }

  async function reopenHoliday(){
    setSaving(true);
    try{await api("ReopenHoliday",{holidayId:gameRef.current.holidayId},jwtRef.current);await loadGame();setStatus("app");showToast("Holiday reopened!");}
    catch(e){showToast(e.message,"err");}
    setSaving(false);
  }

  function buildExport(){
    const {players,places,checkins}=gameRef.current;
    const lines=["PLAYER,PLACE,TYPE,POINTS,TIME"];
    checkins.forEach(c=>{
      const player=players.find(p=>p.id===c.playerId),place=places.find(p=>p.id===c.placeId),tagger=c.isTag?players.find(p=>p.id===c.taggedById):null;
      if(player&&place) lines.push(`${player.name},${place.name},${c.isTag?`Tagged by ${tagger?.name||"?"}`:"Check-in"},${place.points},${new Date(c.timestamp).toLocaleString()}`);
    });
    lines.push("","SUMMARY");
    players.forEach(p=>{const s=userStats(p.id);lines.push(`${p.name},${s.points} pts,${s.visited} places,${s.checkins} check-ins,${s.tagged} tagged`);});
    setExportTxt(lines.join("\n"));
  }

  function userStats(uid){
    if(!game) return {points:0,visited:0,checkins:0,tagged:0};
    const mine=game.checkins.filter(c=>c.playerId===uid);
    const visited=new Set(mine.map(c=>c.placeId));
    const points=mine.reduce((a,c)=>a+(game.places.find(p=>p.id===c.placeId)?.points||0),0);
    return {points,visited:visited.size,checkins:mine.filter(c=>!c.isTag).length,tagged:mine.filter(c=>c.isTag).length};
  }
  function isVisited(uid,placeId){return game?.checkins.some(c=>c.playerId===uid&&c.placeId===placeId);}

  const myStats     = myPlayer?userStats(myPlayer.id):{points:0,visited:0,checkins:0,tagged:0};
  const sorted=(game?.players||[]).map(p=>({...p,...userStats(p.id)})).sort((a,b)=>b.points-a.points);
  const leaderboard=sorted.map((p,i,arr)=>({...p,rank:arr.findIndex(x=>x.points===p.points)+1}));
  const isAdmin     = myPlayer?.isAdmin;
  const takenColors = (game?.players||[]).map(p=>p.color);

  // ══════════════════════════════════════════════════════════════
  // SCREENS
  // ══════════════════════════════════════════════════════════════

  if(status==="booting") return <div className="hq-center"><div className="hq-spin"/><div style={{marginTop:12,opacity:.5,fontSize:13}}>Loading…</div></div>;

  if(status==="error") return <div className="hq-center">
    <div style={{fontSize:32,marginBottom:12}}>⚠️</div>
    <div style={{fontSize:13,opacity:.7,marginBottom:20,textAlign:"center",padding:"0 30px"}}>{error}</div>
    <button className="hq-btn-dark" style={{width:180}} onClick={()=>{setStatus("login");setError(null);}}>Back to Login</button>
  </div>;

  // ── AUTH ───────────────────────────────────────────────────────
  if(status==="login") return <div className="hq-login">
    <div className="hq-sun"/>
    <div className="hq-login-inner">
      <div className="hq-poster"><BenidormMap/></div>
      <div className="hq-eyebrow">— HOLIDAYQUEST —</div>
      <h1 className="hq-title"><span className="t1">Holiday</span><span className="t2">Quest</span></h1>
      <div className="hq-auth-box">
        <div className="hq-auth-tabs">
          <button className={"hq-auth-tab"+(authMode==="login"?" on":"")} onClick={()=>{setAuthMode("login");setAuthError("");setAuthStep("email");}}>Login</button>
          <button className={"hq-auth-tab"+(authMode==="register"?" on":"")} onClick={()=>{setAuthMode("register");setAuthError("");setAuthStep("email");}}>Register</button>
        </div>
        {authMode==="register"&&<input className="hq-input" placeholder="Your name" value={authName} onChange={e=>setAuthName(e.target.value)}/>}
        <input className="hq-input" placeholder="Email" type="email" value={authEmail} onChange={e=>{setAuthEmail(e.target.value);setAuthStep("email");setAuthError("");}}

              {confirmRemovePlace&&<div className="hq-confirm-box">
                <div className="hq-confirm-msg">Remove <b>{confirmRemovePlace.name}</b>? Check-ins for this place will also be deleted.</div>
                <div className="hq-confirm-btns">
                  <button className="hq-btn-cancel" style={{flex:1,padding:"10px"}} onClick={()=>setConfirmRemovePlace(null)}>Cancel</button>
                  <button className="hq-btn-sm danger" style={{flex:1,padding:"10px"}} onClick={()=>{removePlace(confirmRemovePlace.id);setConfirmRemovePlace(null);}}>Remove</button>
                </div>
              </div>}
              <button className="hq-btn-dark" style={{marginTop:12}} onClick={()=>{closeSheet();setTimeout(()=>setSheet({type:"addPlace"}),200);}}>+ Add Place</button>
            </>
          }</>}

          {adminTab==="export"&&<>
            <textarea className="hq-export" readOnly value={exportTxt}/>
            <button className="hq-btn-dark" onClick={()=>navigator.clipboard?.writeText(exportTxt).then(()=>showToast("Copied!")).catch(()=>showToast("Copy manually","err"))}>Copy to clipboard</button>
          </>}

          {adminTab==="finish"&&<div style={{paddingTop:4}}>
            {!wrapConfirm?
              <button className="hq-btn-wrap" onClick={()=>setWrapConfirm(true)}>🎉 Wrap Up Holiday</button>:
              <div className="hq-wrap-confirm">
                <div className="hq-wrap-confirm-msg">Are you sure? Players will only see final results.</div>
                <div className="hq-wrap-confirm-btns">
                  <button className="hq-btn-cancel" onClick={()=>setWrapConfirm(false)}>Cancel</button>
                  <button className="hq-btn-wrap-yes" onClick={wrapUp}>{saving?"Wrapping…":"Yes, wrap it!"}</button>
                </div>
              </div>
            }
          </div>}

        </div>
        <div className="hq-admin-footer">
          <div className="hq-admin-footer-label">⚙️ Admin Settings — {game?.name}</div>
          <div className="hq-admin-tabs">
            <button className={"hq-atab"+(adminTab==="players"?" on":"")} onClick={()=>setAdminTab("players")}>Players</button>
            <button className={"hq-atab"+(adminTab==="places"?" on":"")} onClick={()=>setAdminTab("places")}>Places</button>
            <button className={"hq-atab"+(adminTab==="export"?" on":"")} onClick={()=>{buildExport();setAdminTab("export");}}>Export</button>
            <button className={"hq-atab"+(adminTab==="finish"?" on":"")} onClick={()=>setAdminTab("finish")}>Finish</button>
          </div>
          <button className="hq-btn-cancel" onClick={closeSheet}>Close</button>
        </div>
      </>}

    </div></div>}

    {toast&&<div className={"hq-toast"+(toast.type==="err"?" err":"")}>{toast.msg}</div>}
  </div>;
}

function ActivityLog({game}){
  if(!game) return null;
  return [...game.checkins].sort((a,b)=>b.timestamp-a.timestamp).map((c,i)=>{
    const player=game.players.find(p=>p.id===c.playerId),place=game.places.find(p=>p.id===c.placeId),tagger=c.isTag?game.players.find(p=>p.id===c.taggedById):null;
    if(!player||!place) return null;
    return <article key={c.id} className={"hq-feed-row"+(c.isTag?" tag":"")} style={{animationDelay:i*0.03+"s"}}>
      <span className="hq-av" style={{background:c.isTag?(tagger?.color||"#888"):player.color,width:36,height:36,fontSize:16}}>{initial(c.isTag?tagger?.name:player.name)}</span>
      <div>
        {c.isTag?<div className="hq-feed-line"><b>{tagger?.name}</b> tagged <b style={{color:player.color}}>{player.name}</b> at <b>{place.name}</b></div>
               :<div className="hq-feed-line"><b>{player.name}</b> checked in at <b>{place.name}</b></div>}
        <div className="hq-feed-meta">{timeAgo(c.timestamp)} · <span className="hq-pts">+{place.points} pts</span></div>
      </div>
    </article>;
  });
}

function Podium({leaderboard}){
  return <div className="hq-podium">{[1,0,2].map(idx=>{
    const u=leaderboard[idx]; if(!u) return null;
    const h={0:110,1:78,2:58}[idx];
    const tied=leaderboard.filter(x=>x.points===u.points).length>1;
    return <div key={u.id} className="hq-pod-col">
      <div className="hq-pod-av" style={{background:u.color}}>{initial(u.name)}</div>
      <div className="hq-pod-name">{u.name}</div>
      <div className="hq-pod-pts">{u.points}</div>
      <div className="hq-pod-block" style={{height:h,background:u.color}}><span>{tied?`=${u.rank}`:u.rank}</span></div>
    </div>;
  })}</div>;
}

function ExportSheet({txt,onClose,onCopy}){
  return <><div className="hq-s-eye">DATA EXPORT</div><div className="hq-s-title">All activity</div>
    <textarea className="hq-export" readOnly value={txt}/>
    <button className="hq-btn-dark" onClick={onCopy}>Copy to clipboard</button>
    <button className="hq-btn-cancel" onClick={onClose}>Close</button>
  </>;
}

.hq-btn-dark{width:100%;background:var(--ink);border:1.5px solid var(--ink);color:var(--paper);border-radius:10px;padding:14px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;margin-bottom:8px;}
.hq-btn-dark:disabled{opacity:.5;}
.hq-btn-cancel{width:100%;background:transparent;border:1.5px solid var(--ink);border-radius:10px;padding:12px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink);}
.hq-sheet-admin{display:flex;flex-direction:column;overflow:hidden;padding-bottom:0;}
.hq-admin-content{flex:1;overflow-y:auto;min-height:0;padding-bottom:12px;}
.hq-admin-footer{flex-shrink:0;border-top:1.5px solid rgba(14,27,42,.12);padding:12px 0 28px;background:var(--paper);}
.hq-admin-footer-label{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:2px;color:var(--terra);opacity:.8;margin-bottom:10px;text-transform:uppercase;}
.hq-admin-tabs{display:flex;gap:6px;margin-bottom:10px;}
.hq-atab{flex:1;background:#fff;border:1.5px solid var(--ink);border-radius:9px;padding:9px 6px;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;}
.hq-atab.on{background:var(--ink);color:var(--paper);}
.hq-user-row{background:#fff;border:1.5px solid var(--ink);border-radius:12px;padding:11px 12px;display:flex;align-items:center;gap:10px;margin-bottom:8px;box-shadow:2px 2px 0 var(--ink);}
.hq-ur-name{font-family:'DM Serif Display',serif;font-size:15px;}
.hq-ur-meta{font-family:'JetBrains Mono',monospace;font-size:10px;opacity:.5;margin-top:1px;}
.hq-btn-sm{background:#fff;border:1.5px solid var(--ink);border-radius:8px;padding:6px 10px;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;}
.hq-btn-sm.danger{color:#BB3333;border-color:#ddb0b0;}
.hq-color-row{display:grid;grid-template-columns:repeat(10,28px);gap:8px;margin:4px auto;width:fit-content;}
.hq-color-dot{width:28px;height:28px;border-radius:50%;border:2px solid transparent;cursor:pointer;transition:transform .1s;position:relative;}
.hq-color-dot.sel{border-color:var(--ink);box-shadow:0 0 0 2px #fff,0 0 0 4px var(--ink);}
.hq-color-dot.taken{cursor:not-allowed;opacity:0.5;}
.hq-color-dot.taken::after{content:'';position:absolute;inset:-2px;border-radius:50%;border:2px solid #E53935;background:linear-gradient(45deg,transparent calc(50% - 1px),#E53935 calc(50% - 1px),#E53935 calc(50% + 1px),transparent calc(50% + 1px));pointer-events:none;}
.hq-color-dot.taken.sel{opacity:1;}
.hq-color-dot.taken.sel::after{display:none;}
.hq-color-dot.pale{border-color:rgba(0,0,0,0.3);}
.hq-edit-user{display:flex;flex-direction:column;gap:10px;}
.hq-invite-section{border-top:1.5px dashed var(--ink);margin-top:16px;padding-top:16px;}
.hq-wrap-section{border-top:1.5px dashed var(--ink);margin-top:16px;padding-top:16px;}
.hq-wrap-label{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:2px;opacity:.5;margin-bottom:8px;}
.hq-btn-wrap{width:100%;background:#1a1a1a;border:1.5px solid var(--ink);color:#fff;border-radius:10px;padding:14px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;margin-bottom:8px;}
.hq-wrap-confirm{border:1.5px solid var(--ink);border-radius:12px;padding:14px;background:#fff;margin-bottom:8px;}
.hq-wrap-confirm-msg{font-size:13px;line-height:1.5;margin-bottom:12px;opacity:.8;}
.hq-wrap-confirm-btns{display:flex;gap:8px;}
.hq-wrap-confirm-btns .hq-btn-cancel{flex:1;padding:10px;}
.hq-btn-wrap-yes{flex:1;background:#1a1a1a;border:1.5px solid var(--ink);color:#fff;border-radius:10px;padding:10px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;}
.hq-export{width:100%;height:200px;background:#fff;border:1.5px solid var(--ink);border-radius:10px;padding:12px;font-family:'JetBrains Mono',monospace;font-size:11px;resize:none;margin-bottom:12px;color:var(--ink);}
.hq-toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:11px 22px;border-radius:50px;font-size:13px;font-weight:600;z-index:300;box-shadow:3px 3px 0 var(--coral);animation:toast .35s cubic-bezier(.2,.8,.3,1);font-family:'DM Serif Display',serif;max-width:90vw;text-align:center;white-space:nowrap;}
.hq-toast.err{box-shadow:3px 3px 0 var(--terra);}
.hq-confirm-box{background:#fff4f4;border:1.5px solid #ddb0b0;border-radius:12px;padding:14px;margin-bottom:8px;}
.hq-confirm-msg{font-size:13px;line-height:1.5;margin-bottom:10px;}
.hq-confirm-btns{display:flex;gap:8px;}
.hq-pass-wrap{position:relative;width:100%;}
.hq-pass-wrap .hq-input{padding-right:44px;}
.hq-eye-btn{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:16px;padding:4px;line-height:1;user-select:none;}
.hq-tag-row.selected{background:var(--paper2);border-color:var(--coral);}
.hq-tag-check{color:var(--coral);font-size:18px;font-weight:700;}
@keyframes toast{from{transform:translate(-50%,70px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
@keyframes rise{from{transform:translateY(14px);opacity:0}to{transform:translateY(0);opacity:1}}`;
